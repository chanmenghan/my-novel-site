[project]
name = "finance-agent"
version = "0.1.0"
description = "AI 金融投资研究助手"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "dashscope>=1.20.0",
    "chromadb>=0.4.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.9",
    "akshare>=1.14.0",
    "langchain-text-splitters>=0.3.0",
    "unstructured>=0.12.0",
    "pdfplumber>=0.11.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "graph", "knowledge_base", "tools"]
[project]
name = "xiaoshuo-backend"
version = "0.1.0"
description = "企业级剧本创作多智能体系统 - 基于 LangGraph + MCP"
requires-python = ">=3.10"
dependencies = [
    # Web框架
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # 认证 & 数据库
    "python-dotenv>=1.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "pymysql>=1.1.0",
    # LangChain 核心
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # LangGraph 编排
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-redis>=0.4.0",
    "redis>=5.0.0",
    # MCP 协议
    "mcp>=1.0.0",
    "fastmcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    # RAG & 向量数据库
    "chromadb>=0.4.0",
    "dashscope>=1.20.0",
    # 可观测性
    "langsmith>=0.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-langchain>=0.41b0",
    # 工具 & 实用
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
